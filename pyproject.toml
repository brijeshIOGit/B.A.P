[project]
name = "codeforge"
version = "0.1.0"
description = "CodeForge: a safe multi-agent natural-language-to-code system (LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.32.0",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "sqlglot>=30.31.0",
    "tabulate>=0.10.0",
]

[project.scripts]
codeforge-ui = "codeforge.ui.app:main"
codeforge-demo = "codeforge.cli:demo"
codeforge-chaos = "codeforge.cli:chaos"
codeforge-cost = "codeforge.cli:cost"
codeforge-flywheel = "codeforge.cli:flywheel"
codeforge-reset = "codeforge.cli:reset"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
